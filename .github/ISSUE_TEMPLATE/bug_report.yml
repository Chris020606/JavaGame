name: Report a game bug
description: Tell us what happened in Outpost.
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: Game version
      placeholder: v4.5.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Your computer
      options:
        - Windows x64
        - macOS Apple Silicon
        - macOS Intel
        - Linux x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Include the steps to reproduce it, your class and the chapter.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or error output
      description: Attach a screenshot or paste the error, if available.
